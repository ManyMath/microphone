name: Private Microphone payload verification
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_HOME: ${{ runner.temp }}/microphone-cargo-${{ github.run_id }}
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CARGO_BUILD_JOBS: '3'
permissions:
  contents: read
jobs:
  linux:
    runs-on: manymath-maintenance-linux-x64
    steps:
    - name: Require the private primary forge
      env:
        PRIMARY_SERVER: ${{ github.server_url }}
      run: test "$PRIMARY_SERVER" = 'https://git.manymath.com'
    - uses: actions/checkout@v4
    - name: Rebuild exact tooling identity from private fork
      env:
        GIT_SSH_COMMAND: /usr/bin/ssh -o Hostname=195.201.108.115 -p 2222 -l git -o ProxyCommand=none -o ProxyJump=none
        GIT_SSH_VARIANT: ssh
      run: |
        source_root="$(mktemp -d)"
        trap 'rm -rf "$source_root"' EXIT
        git -c core.hooksPath=/dev/null clone --quiet --no-checkout ssh://git@git.manymath.com:2222/sneurlax/cargokit.git "$source_root/fork"
        python3 tool/cargokit_sync.py --manifest tool/cargokit/manifest.json --source "$source_root/fork" --check packages/microphone_flutter/cargokit
    - name: Record provisioned toolchains
      run: 'python3 --version

        dart --version

        flutter --version

        cargo --version

        '
    - name: Payload regression fixtures
      run: python3 -m unittest discover -s tool/tests -v
    - name: Source tests and analysis
      run: 'flutter pub get

        dart analyze packages/microphone_dart

        dart test packages/microphone_dart

        flutter test packages/microphone_flutter/test

        flutter analyze packages/microphone_flutter/example

        cargo test --locked --manifest-path packages/microphone_flutter/rust/Cargo.toml

        '
    - name: Actual pub archives and native consumers
      run: 'evidence_root="$(mktemp -d)"

        python3 tool/native_payload.py --config tool/payload.json --mode candidate
        --output "$evidence_root/candidate"

        python3 tool/hosted_dart_smoke.py --candidate "$evidence_root/candidate" --output
        "$evidence_root/hosted"

        cat "$evidence_root/candidate/evidence.json" "$evidence_root/hosted/evidence.json"

        echo "Private candidate archives and logs retained on runner at $evidence_root"

        '
    timeout-minutes: 60
'on':
  push:
    branches:
    - main
    - maintenance/**
  pull_request: null
  workflow_dispatch: null

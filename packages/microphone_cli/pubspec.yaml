name: microphone_cli
description: >-
  Cross-platform microphone capture for Dart and Flutter with no system
  dependencies. Pure Dart; reaches native capture via FFI.
version: 0.0.1
publish_to: none
repository: https://github.com/ManyMath/microphone_cli
issue_tracker: https://github.com/ManyMath/microphone_cli/issues
topics:
  - audio
  - microphone
  - recording
  - ffi

environment:
  sdk: ^3.5.0

resolution: workspace

dependencies:
  ffi: ^2.1.0
  web: ^1.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
